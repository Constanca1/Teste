<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix Face</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:monospace;color:#33ff66}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:2;text-align:center}
  #ui.off{display:none}
  button{background:transparent;color:#33ff66;border:1px solid #33ff66;padding:14px 28px;font:inherit;font-size:18px;cursor:pointer}
  button:hover{background:#33ff66;color:#000}
  #status{position:fixed;left:12px;bottom:10px;font-size:12px;opacity:.7;z-index:3}
  video{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>
<div id="ui">
  <h1>01001101 01100101</h1>
  <p>Vou usar a câmara para desenhar a tua cara em 0s e 1s.<br>Mexe a cabeça, levanta a mão, deita a língua de fora.</p>
  <button id="start">Ligar câmara</button>
</div>
<div id="status"></div>

<script type="module">
import { FaceLandmarker, HandLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const video = document.getElementById("v");
const statusEl = document.getElementById("status");
const ui = document.getElementById("ui");
let W, H, dpr;
function resize(){ dpr = devicePixelRatio||1; W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener("resize", resize); resize();

// rotação 3D com o rato (ou toque) para veres a profundidade
let rotY = 0, rotX = 0, tY = 0, tX = 0;
addEventListener("pointermove", e => {
  tY = (e.clientX/W - .5) * 1.6;
  tX = (e.clientY/H - .5) * -0.8;
});

let face, hand, lastTime = -1, faceRes = null, handRes = null;

document.getElementById("start").onclick = async () => {
  try {
    statusEl.textContent = "A pedir câmara…";
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480, facingMode:"user" } });
    video.srcObject = stream; await video.play();
    ui.classList.add("off");
    statusEl.textContent = "A carregar modelos de IA…";
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const base = "https://storage.googleapis.com/mediapipe-models/";
    face = await FaceLandmarker.createFromOptions(fs, {
      baseOptions:{ modelAssetPath: base+"face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate:"GPU" },
      runningMode:"VIDEO", numFaces:1, outputFaceBlendshapes:true });
    hand = await HandLandmarker.createFromOptions(fs, {
      baseOptions:{ modelAssetPath: base+"hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"GPU" },
      runningMode:"VIDEO", numHands:2 });
    statusEl.textContent = "Pronto. Mexe o rato para rodar a cabeça em 3D.";
    FACE_EDGES = FaceLandmarker.FACE_LANDMARKS_TESSELATION;
    HAND_EDGES = HandLandmarker.HAND_CONNECTIONS;
  } catch(err){
    ui.classList.remove("off");
    statusEl.textContent = "Erro: " + err.message;
  }
};

let FACE_EDGES = [], HAND_EDGES = [];

// projeta um ponto normalizado (x,y,z) para o ecrã com perspetiva
function project(p, S, aspect){
  let x = (0.5 - p.x) * aspect * S;      // espelhado, como um espelho
  let y = (p.y - 0.5) * S;
  let z = -p.z * aspect * S * 1.5;       // z negativo = mais perto da câmara
  const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
  let x1 = x*cy + z*sy, z1 = -x*sy + z*cy;
  let y1 = y*cx - z1*sx, z2 = y*sx + z1*cx;
  const f = S*1.6, k = f/(f + z2);
  return { x: W/2 + x1*k, y: H/2 + y1*k, d: z2/S, k };
}

function digit(i, t){ return ((i*2654435761 + Math.floor(t/400 + (i%7))) >>> 3) & 1 ? "1" : "0"; }

function drawEdges(lms, edges, samples, S, aspect, t, color, size, seed){
  const P = lms.map(p => project(p, S, aspect));
  let n = seed;
  for (const e of edges){
    const a = P[e.start], b = P[e.end];
    for (let s=0; s<samples; s++){
      const u = s/samples;
      const x = a.x+(b.x-a.x)*u, y = a.y+(b.y-a.y)*u, d = a.d+(b.d-a.d)*u, k = a.k+(b.k-a.k)*u;
      const alpha = Math.max(.15, Math.min(1, .75 - d*1.6));
      ctx.fillStyle = color + alpha.toFixed(2) + ")";
      ctx.font = Math.max(6, size*k) + "px monospace";
      ctx.fillText(digit(n++, t), x, y);
    }
  }
}

function drawTongue(lms, amount, S, aspect, t){
  const m = project(lms[14], S, aspect), chin = project(lms[17], S, aspect);
  const len = amount * S * 0.16;
  for (let i=0;i<70;i++){
    const u = (i%14)/14, v = Math.floor(i/14)/5 - .5;
    const w = 14*(1-u*.5);
    const x = chin.x + v*w*2, y = chin.y + u*len;
    ctx.fillStyle = "rgba(255,90,140,"+(1-u*.4).toFixed(2)+")";
    ctx.font = (11*m.k)+"px monospace";
    ctx.fillText(digit(i, t), x, y);
  }
}

function loop(){
  requestAnimationFrame(loop);
  const t = performance.now();
  rotY += (tY - rotY)*.08; rotX += (tX - rotX)*.08;
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0,0,W,H);
  if (!face || video.readyState < 2) return;
  if (video.currentTime !== lastTime){
    lastTime = video.currentTime;
    faceRes = face.detectForVideo(video, t);
    handRes = hand.detectForVideo(video, t);
  }
  const aspect = video.videoWidth / video.videoHeight;
  const S = Math.min(H*1.05, W/aspect*1.05);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  if (faceRes && faceRes.faceLandmarks.length){
    const lms = faceRes.faceLandmarks[0];
    drawEdges(lms, FACE_EDGES, 2, S, aspect, t, "rgba(51,255,102,", 9, 0);
    const bs = faceRes.faceBlendshapes?.[0]?.categories || [];
    const tongue = bs.find(c => c.categoryName === "tongueOut")?.score || 0;
    if (tongue > 0.25) drawTongue(lms, Math.min(1, tongue*1.4), S, aspect, t);
  }
  if (handRes && handRes.landmarks.length){
    handRes.landmarks.forEach((h, i) =>
      drawEdges(h, HAND_EDGES, 6, S, aspect, t, "rgba(80,220,255,", 13, 5000 + i*999));
  }
}
loop();
</script>
</body>
</html>
