<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Balls</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="top">
    <h1 id="title">Drums</h1>
    <button class="gear" id="gear" aria-label="Sound settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="panel" hidden>
    <label for="vol">Volume:</label><input type="range" id="vol" min="0" max="1" step=".05" value=".8">
    <label for="pit">Pitch:</label><input type="range" id="pit" min="-1" max="1" step=".05" value="0">
    <p class="hint">Record 1.5 s of sound for each ball. Without a recording, the default sound plays.</p>
    <div id="rows"></div>
    <button class="btn" id="save">Save changes</button>
  </div>
  <div class="mid">
    <button class="arrow" id="prev" aria-label="Previous instrument">←</button>
    <div id="stage"><video id="video" playsinline muted></video><canvas id="hands"></canvas></div>
    <button class="arrow" id="next" aria-label="Next instrument">→</button>
  </div>
  <div id="msg"></div>
  <div class="bar">
    <button class="btn" id="start">Start playing</button>
    <button class="btn rec" id="musicRec">Record music</button>
    <div id="musicOut"></div>
  </div>
</main>

<dialog id="help">
  <h2>How to play</h2>
  <ol>
    <li>Allow access to your camera.</li>
    <li>Show both hands to the camera.</li>
    <li>Move your fingers into a ball, as if you were playing.</li>
    <li>The ball glows when you hit it.</li>
  </ol>
  <button class="btn" id="go">Let's play</button>
  <button class="btn" id="cancel">Cancel</button>
</dialog>

<script type="module" src="script.js"></script>
</body>
</html>
