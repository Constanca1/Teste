<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Constança e Lidia programadoras</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #5c94fc;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
    }

    /* Título pixel branco com borda amarela */
    h1 {
      color: #fff;
      font-size: clamp(1rem, 3.6vw, 2.4rem);
      line-height: 1.7;
      text-align: center;
      margin: 0;
      text-shadow:
        4px 0 #f8d800, -4px 0 #f8d800, 0 4px #f8d800, 0 -4px #f8d800,
        4px 4px #f8d800, -4px -4px #f8d800, 4px -4px #f8d800, -4px 4px #f8d800,
        7px 7px 0 #000;
    }

    .conteudo {
      position: relative;
      z-index: 5;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 20px 20px 100px;
    }
    .avatares {
      display: flex;
      gap: 30px;
      align-items: flex-end;
    }
    .avatares svg {
      width: clamp(110px, 20vw, 200px);
      height: auto;
      animation: saltar 1s ease-in-out infinite alternate;
    }
    .avatares svg:nth-child(2) { animation-delay: 0.5s; }
    @keyframes saltar {
      from { transform: translateY(0); }
      to   { transform: translateY(-14px); }
    }

    /* Chão de tijolos */
    .chao {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 80px;
      background-color: #c84c0c;
      background-image:
        linear-gradient(#000 4px, transparent 4px),
        linear-gradient(90deg, #000 4px, transparent 4px);
      background-size: 64px 40px;
      border-top: 8px solid #00a800;
      z-index: 3;
    }

    /* Colinas */
    .colina {
      position: fixed; bottom: 80px;
      background: #00a800;
      border: 4px solid #000;
      border-bottom: none;
      border-radius: 200px 200px 0 0;
      z-index: 1;
    }
    .c1 { left: 3%;  width: 280px; height: 140px; }
    .c2 { right: 4%; width: 200px; height: 100px; }

    /* Nuvens */
    .nuvem {
      position: absolute;
      width: 90px; height: 32px;
      background: #fff;
      border-radius: 32px;
      z-index: 2;
      animation: deriva 40s linear infinite;
    }
    .nuvem::before, .nuvem::after {
      content: ""; position: absolute; background: #fff; border-radius: 50%;
    }
    .nuvem::before { width: 40px; height: 40px; top: -20px; left: 12px; }
    .nuvem::after  { width: 50px; height: 50px; top: -28px; left: 40px; }
    .n1 { top: 10%; left: -120px; }
    .n2 { top: 25%; left: -120px; animation-delay: -18s; animation-duration: 55s; }
    .n3 { top: 6%;  left: -120px; animation-delay: -32s; animation-duration: 48s; }
    @keyframes deriva {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw + 240px)); }
    }

    /* Bloco "?" */
    .bloco {
      position: fixed; right: 18%; top: 22%;
      width: 56px; height: 56px;
      background: #f8b800;
      border: 4px solid #000;
      color: #fff;
      font-size: 28px;
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
      animation: saltar 0.8s ease-in-out infinite alternate;
    }

    /* Personagem a voar (estilo Flappy Bird) */
    .voador {
      position: fixed;
      top: 14%;
      left: -160px;
      width: clamp(90px, 14vw, 150px);
      z-index: 6;
      pointer-events: none;
      animation: cruzar 14s linear infinite;
    }
    .voador svg { width: 100%; height: auto; display: block; }
    .voador .corpo {
      animation: pulinho 0.9s ease-in-out infinite;
    }
    @keyframes cruzar {
      from { left: -160px; }
      to   { left: 100%; }
    }
    @keyframes pulinho {
      0%   { transform: translateY(40px)  rotate(-20deg); }
      25%  { transform: translateY(-30px) rotate(-20deg); }
      100% { transform: translateY(40px)  rotate(25deg); }
    }
    .asa {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: bater 0.2s ease-in-out infinite alternate;
    }
    @keyframes bater {
      from { transform: rotate(-25deg); }
      to   { transform: rotate(25deg); }
    }
  </style>
</head>
<body>

  <!-- Fundo Mario -->
  <div class="nuvem n1"></div>
  <div class="nuvem n2"></div>
  <div class="nuvem n3"></div>
  <div class="bloco">?</div>
  <div class="colina c1"></div>
  <div class="colina c2"></div>
  <div class="chao"></div>

  <!-- Título e personagens -->
  <div class="conteudo">
    <h1>Constança e Lidia<br>programadoras</h1>

    <div class="avatares">

      <!-- Personagem 1: franja, argolas, top preto -->
      <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
        <path d="M38 225 L38 95 Q38 18 100 18 Q162 18 162 95 L162 225 Z" fill="#5a3a22"/>
        <path d="M28 240 Q40 188 100 182 Q160 188 172 240 Z" fill="#111"/>
        <rect x="88" y="150" width="24" height="38" fill="#f1c3a5"/>
        <path d="M82 188 Q100 210 118 188" fill="none" stroke="#111" stroke-width="2"/>
        <ellipse cx="100" cy="102" rx="45" ry="55" fill="#f1c3a5"/>
        <path d="M52 98 Q52 38 100 38 Q148 38 148 98 Q130 64 100 72 Q70 64 52 98 Z" fill="#5a3a22"/>
        <circle cx="83" cy="104" r="6" fill="#2b1a10"/><circle cx="85" cy="102" r="2" fill="#fff"/>
        <circle cx="117" cy="104" r="6" fill="#2b1a10"/><circle cx="119" cy="102" r="2" fill="#fff"/>
        <ellipse cx="70" cy="124" rx="9" ry="6" fill="#ee8c8c" opacity=".7"/>
        <ellipse cx="130" cy="124" rx="9" ry="6" fill="#ee8c8c" opacity=".7"/>
        <path d="M90 134 Q100 140 110 134" fill="none" stroke="#b5524f" stroke-width="3" stroke-linecap="round"/>
        <circle cx="54" cy="132" r="13" fill="none" stroke="#bbb" stroke-width="3"/>
        <circle cx="146" cy="132" r="13" fill="none" stroke="#bbb" stroke-width="3"/>
      </svg>

      <!-- Personagem 2: risca ao meio, top rosa -->
      <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
        <path d="M34 225 L34 100 Q34 18 100 18 Q166 18 166 100 L166 225 Z" fill="#6b4a32"/>
        <path d="M24 240 Q38 188 100 182 Q162 188 176 240 Z" fill="#d6457f"/>
        <rect x="88" y="150" width="24" height="38" fill="#e9b794"/>
        <ellipse cx="100" cy="102" rx="47" ry="55" fill="#e9b794"/>
        <path d="M52 100 Q50 38 100 36 Q150 38 148 100 Q135 58 100 52 Q65 58 52 100 Z" fill="#6b4a32"/>
        <path d="M74 94 Q83 88 92 94" fill="none" stroke="#4a2f1c" stroke-width="4" stroke-linecap="round"/>
        <path d="M108 94 Q117 88 126 94" fill="none" stroke="#4a2f1c" stroke-width="4" stroke-linecap="round"/>
        <circle cx="83" cy="106" r="6" fill="#4a3a20"/><circle cx="85" cy="104" r="2" fill="#fff"/>
        <circle cx="117" cy="106" r="6" fill="#4a3a20"/><circle cx="119" cy="104" r="2" fill="#fff"/>
        <ellipse cx="70" cy="126" rx="9" ry="6" fill="#ee8c8c" opacity=".6"/>
        <ellipse cx="130" cy="126" rx="9" ry="6" fill="#ee8c8c" opacity=".6"/>
        <path d="M90 136 Q100 141 110 136" fill="none" stroke="#a8504c" stroke-width="3" stroke-linecap="round"/>
      </svg>

    </div>
  </div>

  <!-- Personagem a voar (Flappy Bird) -->
  <div class="voador">
    <div class="corpo">
      <svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="armacao" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d94a4a"/>
            <stop offset="0.5" stop-color="#4a7bd9"/>
            <stop offset="1" stop-color="#f2b632"/>
          </linearGradient>
        </defs>

        <!-- Asas -->
        <g class="asa">
          <ellipse cx="22" cy="150" rx="30" ry="15" fill="#fff" stroke="#000" stroke-width="4" transform="rotate(-30 22 150)"/>
        </g>
        <g class="asa">
          <ellipse cx="178" cy="150" rx="30" ry="15" fill="#fff" stroke="#000" stroke-width="4" transform="rotate(30 178 150)"/>
        </g>

        <!-- Camisa colorida -->
        <path d="M28 230 Q40 170 100 164 Q160 170 172 230 Z" fill="#4a86c8"/>
        <circle cx="62" cy="200" r="9" fill="#3cc9a5"/>
        <circle cx="100" cy="212" r="10" fill="#a56cd6"/>
        <circle cx="138" cy="198" r="9" fill="#f2e04a"/>
        <circle cx="80" cy="180" r="6" fill="#a56cd6"/>
        <circle cx="124" cy="182" r="6" fill="#3cc9a5"/>

        <!-- Pescoço -->
        <rect x="88" y="142" width="24" height="28" fill="#e8b98f"/>

        <!-- Cabelo de trás (mullet) -->
        <path d="M44 156 L44 86 Q44 22 100 22 Q156 22 156 86 L156 156 Q140 138 100 138 Q60 138 44 156 Z" fill="#2a1d17"/>

        <!-- Cara -->
        <ellipse cx="100" cy="102" rx="44" ry="52" fill="#e8b98f"/>

        <!-- Barba por fazer -->
        <path d="M58 112 Q62 154 100 158 Q138 154 142 112 Q130 134 100 136 Q70 134 58 112 Z" fill="#5a4034" opacity="0.35"/>

        <!-- Franja -->
        <path d="M54 92 Q50 34 100 32 Q150 34 146 92 Q135 62 100 66 Q65 62 54 92 Z" fill="#2a1d17"/>

        <!-- Óculos coloridos -->
        <rect x="58" y="90" width="38" height="28" rx="4" fill="#fff" fill-opacity="0.35" stroke="url(#armacao)" stroke-width="6"/>
        <rect x="104" y="90" width="38" height="28" rx="4" fill="#fff" fill-opacity="0.35" stroke="url(#armacao)" stroke-width="6"/>
        <line x1="96" y1="98" x2="104" y2="98" stroke="#4a7bd9" stroke-width="5"/>
        <circle cx="77" cy="104" r="4" fill="#2b1a10"/>
        <circle cx="123" cy="104" r="4" fill="#2b1a10"/>

        <!-- Bigode e sorriso -->
        <path d="M76 124 Q100 114 124 124 Q112 132 100 126 Q88 132 76 124 Z" fill="#2a1d17"/>
        <path d="M88 140 Q100 148 112 140" fill="none" stroke="#a8504c" stroke-width="3" stroke-linecap="round"/>

        <!-- Brinco -->
        <circle cx="55" cy="122" r="7" fill="none" stroke="#aaa" stroke-width="3"/>
      </svg>
    </div>
  </div>

</body>
</html>
